    content="width=device-width": Устанавливает ширину области просмотра равной ширине устройства. Это позволяет странице адаптироваться к различным размерам экранов.
    initial-scale=1.0: Устанавливает начальный масштаб страницы на 100%, то есть без увеличения или уменьшения. -->

</head>
