<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кулинарный сборник</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
      }
      .header {
        background-color: #4caf50;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .container {
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
        background-color: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .btn {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 10px 20px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 10px 0;
        cursor: pointer;
        border-radius: 4px;
      }
      .btn:hover {
        background-color: #45a049;
      }
      .recipe-card {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 20px;
        background-color: #f9f9f9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }

      table,
      th,
      td {
        border: 1px solid #ddd;
      }

      th {
        background-color: #4caf50;
        color: white;
        text-align: left;
      }

      th,
      td {
        padding: 12px;
        vertical-align: top;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tr:hover {
        background-color: #e9e9e9;
      }
    </style>
  </head>
  <body>
    <div id="app">
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        loadPage("home");
        window.addEventListener("popstate", function () {
          const page = window.location.hash.substr(1) || "home";
          loadPage(page);
        });
      });

      function loadPage(page) {
        const app = document.getElementById("app");

        // Создаем AJAX запрос
        const xhr = new XMLHttpRequest();
        xhr.open("GET", `pages/${page}.html`, true);

        xhr.onload = function () {
          if (this.status === 200) {
            app.innerHTML = this.responseText;
          } else {
            loadPage("home");
          }
        };

        xhr.onerror = function () {
          loadPage("home");
        };

        xhr.send();
      }

      function navigateTo(page) {
        // Изменяем URL без перезагрузки страницы
        window.history.pushState(null, null, `#${page}`);
        loadPage(page);
      }
      function loadRecipesFromJson() {
        const container = document.getElementById("json-recipes-container");
        container.innerHTML = "<p>Загрузка рецептов...</p>";

        const xhr = new XMLHttpRequest();
        xhr.open("GET", "recipes.json", true);

        xhr.onload = function () {
          if (this.status === 200) {
            try {
              const recipes = JSON.parse(this.responseText);
              displayRecipesAsTable(recipes, container);
            } catch (e) {
              container.innerHTML =
                '<p style="color: red;">Ошибка при разборе JSON</p>';
            }
          } else {
            container.innerHTML =
              '<p style="color: red;">Ошибка загрузки файла</p>';
          }
        };

        xhr.onerror = function () {
          container.innerHTML = '<p style="color: red;">Ошибка сети</p>';
        };

        xhr.send();
      }

      function displayRecipesAsTable(recipes, container) {
        let html = "<h2>Все рецепты</h2>";
        html +=
          '<table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse; margin-top: 10px;">';
        html +=
          "<tr><th>Название</th><th>Ингредиенты</th><th>Инструкция</th></tr>";

        for (const [name, recipe] of Object.entries(recipes)) {
          html += `<tr>
            <td><strong>${name}</strong></td>
            <td><ul>${recipe.ingredients
              .map((i) => `<li>${i}</li>`)
              .join("")}</ul></td>
            <td><ol>${recipe.instructions
              .map((i) => `<li>${i}</li>`)
              .join("")}</ol></td>
        </tr>`;
        }

        html += "</table>";
        container.innerHTML = html;
      }
      function downloadJsonFile() {
        const link = document.createElement('a');
    link.href = '/download';
    link.download = 'recipes.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
    </script>
  </body>
</html>
